name: Build Cardputer Adv Firmware Online

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'platformio.ini'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e m5stack-cardputer-adv

      - name: Prepare firmware artifact
        run: mkdir -p dist && cp .pio/build/m5stack-cardputer-adv/firmware.bin dist/firmware.bin

      - name: Upload firmware.bin
        uses: actions/upload-artifact@v4
        with:
          name: cardputer-adv-firmware
          path: dist/firmware.bin
          if-no-files-found: error